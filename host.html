<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Face-Off Host</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root { --gold:#ffcf3f; --team0:#ff4d4d; --team1:#25d0c4; --red:#e8142b; --bg:#041238; --card:#0b2a72; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: 'Oswald', system-ui, sans-serif; padding: 12px 16px 40px; }
  h1 { font-family: 'Anton', Impact, sans-serif; color: var(--gold); margin: 0; font-size: 26px; letter-spacing: .03em; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #conn { font-size: 13px; opacity: .8; display: flex; gap: 6px; align-items: center; }
  #conn i { width: 10px; height: 10px; border-radius: 50%; background: #777; display: inline-block; }
  #conn.on i { background: #2ee86b; box-shadow: 0 0 6px #2ee86b; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  #buzzCard { text-align: center; padding: 18px 12px; border: 3px solid transparent; transition: background .2s; }
  #buzzCard .big { font-family: 'Anton', Impact, sans-serif; font-size: 34px; line-height: 1.1; text-transform: uppercase; }
  #buzzCard .small { font-size: 15px; opacity: .85; margin-top: 4px; }
  #buzzCard.armed { border-color: var(--gold); animation: pulse 1s infinite; }
  #buzzCard.t0 { background: var(--team0); color: #fff; }
  #buzzCard.t1 { background: var(--team1); color: #032; }
  @keyframes pulse { 50% { border-color: transparent; } }
  button { font-family: 'Oswald', sans-serif; font-size: 17px; letter-spacing: .03em; padding: 12px; border-radius: 10px; border: 2px solid #8fb4ff;
    background: linear-gradient(#2459c9, #0d2f7e); color: #fff; width: 100%; cursor: pointer; }
  button:active { filter: brightness(1.3); transform: scale(.98); }
  button.bad { border-color: var(--red); background: linear-gradient(#a3142a, #5b0a17); }
  button.gold { border-color: var(--gold); background: linear-gradient(#ffd863, #b07d0a); color: #2a1a00; font-weight: 700; }
  button.t0 { border-color: var(--team0); } button.t1 { border-color: var(--team1); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .q { font-size: 19px; line-height: 1.3; }
  .meta { font-size: 13px; opacity: .7; margin-bottom: 4px; letter-spacing: .08em; }
  .ans { display: flex; justify-content: space-between; text-align: left; margin-top: 6px; background: #12348a; border-color: #4a6cc0; }
  .ans.on { background: #1d7a3a; border-color: #5be38a; }
  .ans .n { opacity: .6; margin-right: 8px; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
  .scores .s { font-family: 'Anton', Impact, sans-serif; font-size: 34px; }
  .scores .nm { font-size: 14px; border-bottom: 3px solid var(--c); padding-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scores .ctl { font-size: 12px; color: var(--gold); height: 16px; }
  .bankline { display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
  .bankline b { font-family: 'Anton', Impact, sans-serif; font-size: 30px; color: var(--gold); }
  .xs { color: var(--red); font-family: 'Anton', Impact, sans-serif; font-size: 24px; letter-spacing: 4px; }
  #setup textarea, #setup input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #4a6cc0; background: #020c2c; color: #fff; font: 14px ui-monospace, monospace; margin: 6px 0; }
  #setup textarea { min-height: 140px; }
  #log { font: 13px ui-monospace, monospace; opacity: .85; max-height: 180px; overflow: auto; }
  #log div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="top"><h1>FACE-OFF HOST</h1><div id="conn"><i></i><span>not connected</span></div></div>

<div id="setup" class="card hidden">
  <div class="meta">CONNECT TO THE TV</div>
  <div>Type the room code and PIN from ⚙ Setup on the TV, or scan the host QR code there.</div>
  <input id="roomIn" placeholder="ROOM (4 letters)" maxlength="4" autocomplete="off">
  <input id="pinIn" placeholder="PIN (4 digits)" maxlength="4" inputmode="numeric" type="password" autocomplete="off">
  <button class="gold" id="connectBtn">Connect</button>
  <details style="margin-top:10px;font-size:14px;opacity:.8"><summary>Advanced: use a different Firebase project</summary>
    <textarea id="cfgIn" placeholder="Only needed if this website wasn't published with a Firebase config."></textarea></details>
</div>

<div id="game" class="hidden">
  <div id="buzzCard" class="card"><div class="big">—</div><div class="small"></div></div>
  <button class="gold" data-cmd="arm">⚡ ARM BUZZERS</button>

  <div class="card" style="margin-top:12px">
    <div class="meta" id="roundMeta"></div>
    <div class="q" id="question"></div>
    <div id="answers"></div>
    <button data-cmd="revealAll" style="margin-top:8px">Reveal the rest (no points)</button>
  </div>

  <div class="card">
    <div class="bankline"><span>BANK</span><b id="bank">0</b><span class="xs" id="xs"></span></div>
    <div class="row">
      <button class="bad" data-cmd="x1">✕ Face-off miss</button>
      <button class="bad" data-cmd="strike">✕ Strike</button>
    </div>
    <div class="row"><button data-cmd="clearStrikes">Clear strikes</button><button data-cmd="resetRound">Restart round</button></div>
  </div>

  <div class="card">
    <div class="scores">
      <div style="--c:var(--team0)"><div class="nm" id="n0"></div><div class="s" id="s0">0</div><div class="ctl" id="c0"></div></div>
      <div style="--c:var(--team1)"><div class="nm" id="n1"></div><div class="s" id="s1">0</div><div class="ctl" id="c1"></div></div>
    </div>
    <div class="row">
      <button class="t0" data-cmd="control" data-team="0">Give control</button>
      <button class="t1" data-cmd="control" data-team="1">Give control</button>
    </div>
    <div class="row">
      <button class="t0 gold" data-cmd="award" data-team="0">Award bank</button>
      <button class="t1 gold" data-cmd="award" data-team="1">Award bank</button>
    </div>
    <div class="row">
      <div class="row" style="margin:0"><button class="t0" data-cmd="adjust" data-team="0" data-d="-5">−5</button><button class="t0" data-cmd="adjust" data-team="0" data-d="5">+5</button></div>
      <div class="row" style="margin:0"><button class="t1" data-cmd="adjust" data-team="1" data-d="-5">−5</button><button class="t1" data-cmd="adjust" data-team="1" data-d="5">+5</button></div>
    </div>
  </div>

  <div class="row3">
    <button data-cmd="prev">◀ Prev</button>
    <button data-cmd="next" class="gold" style="grid-column: span 2">Next round ▶</button>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="meta">BUZZERS CONNECTED</div>
    <div id="log"></div>
  </div>

  <button class="bad" id="newGame" style="margin-top:4px">New game</button>
  <button id="disconnect" style="margin-top:8px; opacity:.6">Change room / config</button>
</div>

<script src="firebase-config.js?v=5" onerror="window.FIREBASE_CONFIG = window.FIREBASE_CONFIG || null"></script>
<script src="common.js?v=5"></script>
<script>
(() => {
  const F = window.FFO, { store, FB, dec } = F;
  let players = {};
  const $ = s => document.querySelector(s);
  let st = null;

  // Room + PIN come from the QR code (#fragment, never sent to a server) or from last time on this phone.
  let saved = store.get('host', null);
  if (location.hash.length > 1) {
    try { const d = dec(location.hash.slice(1)); if (d.r && d.p) { saved = { room: d.r, pin: d.p }; store.set('host', saved); } } catch {}
    history.replaceState(null, '', location.pathname);
  }
  $('#roomIn').addEventListener('input', e => (e.target.value = F.cleanRoom(e.target.value)));
  $('#pinIn').addEventListener('input', e => (e.target.value = F.cleanPin(e.target.value)));
  if (saved && F.validRoom(saved.room) && F.validPin(saved.pin)) connect(saved.room, saved.pin);
  else $('#setup').classList.remove('hidden');

  $('#connectBtn').onclick = () => {
    const room = F.cleanRoom($('#roomIn').value), pin = F.cleanPin($('#pinIn').value);
    if (!F.validRoom(room) || !F.validPin(pin)) return alert('Enter the 4-letter room code and the 4-digit PIN.');
    if ($('#cfgIn').value.trim()) store.set('fbConfig', $('#cfgIn').value.trim());
    store.set('host', { room, pin });
    location.reload();
  };
  $('#disconnect').onclick = () => { store.set('host', null); location.reload(); };

  async function connect(room, pin) {
    const err = FB.init(F.getConfig());
    if (err) {
      $('#setup').classList.remove('hidden');
      return alert(err === 'NO_CONFIG' ? 'This website has no Firebase project set up yet (see README).' : err);
    }
    FB.join(room, pin);
    try {
      const snap = await FB.ref('state').once('value');
      if (!snap.exists()) { store.set('host', null); $('#setup').classList.remove('hidden'); $('#roomIn').value = room; return alert('No game found with that room code and PIN. Is the TV page open?'); }
    } catch (e) { $('#setup').classList.remove('hidden'); return alert(F.friendlyError(e)); }
    $('#game').classList.remove('hidden');
    FB.onConnected(on => {
      $('#conn').className = on ? 'on' : '';
      $('#conn span').textContent = (on ? 'live · room ' : 'connecting · room ') + room;
    });
    FB.ref('state').on('value', s => { st = s.val(); render(); }, e => alert(F.friendlyError(e)));
    FB.ref('players').on('value', s => { players = s.val() || {}; render(); });
  }

  function send(cmd) {
    cmd.ts = Date.now();
    FB.ref('commands').push(JSON.parse(JSON.stringify(cmd)));
    if (navigator.vibrate) navigator.vibrate(20);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-cmd]');
    if (!b) return;
    send({ t: b.dataset.cmd, team: b.dataset.team, d: b.dataset.d ? +b.dataset.d : undefined, i: b.dataset.i });
  });
  $('#newGame').onclick = () => { if (confirm('Reset scores and go back to round 1?')) send({ t: 'newGame' }); };

  function render() {
    if (!st) { $('#buzzCard .big').textContent = 'Waiting for the board…'; return; }
    const names = st.teamNames || ['Team One', 'Team Two'];
    const bc = $('#buzzCard');
    bc.className = 'card';
    $('#log').innerHTML = '';
    [0, 1].forEach(t => {
      const list = Object.values(players).filter(p => p && p.team === t).map(p => p.name || 'buzzer');
      const d = document.createElement('div');
      d.textContent = `${names[t]}: ${list.length ? list.join(', ') : 'none yet'}`;
      $('#log').appendChild(d);
    });
    if (st.armed) { bc.classList.add('armed'); bc.querySelector('.big').textContent = 'Buzzers armed'; bc.querySelector('.small').textContent = 'Waiting for someone to buzz…'; }
    else if (st.buzz) {
      bc.classList.add('t' + st.buzz.team);
      bc.querySelector('.big').textContent = names[st.buzz.team] + ' buzzed first!';
      if (st.buzz.player) bc.querySelector('.big').textContent += ' (' + st.buzz.player + ')';
      bc.querySelector('.small').textContent = st.buzz.lateBy != null ? `${names[1 - st.buzz.team]} was ${(st.buzz.lateBy / 1000).toFixed(3)}s behind` : '';
    } else { bc.querySelector('.big').textContent = 'Buzzers off'; bc.querySelector('.small').textContent = 'Tap ARM for the next face-off'; }

    $('#roundMeta').textContent = `ROUND ${st.round + 1} / ${st.totalRounds} · ${['', 'SINGLE', 'DOUBLE', 'TRIPLE'][st.multiplier] || ''} POINTS`;
    $('#question').textContent = st.question || '(no question)';
    const box = $('#answers'); box.innerHTML = '';
    (st.answers || []).forEach((a, i) => {
      const b = document.createElement('button');
      b.className = 'ans' + (a.revealed ? ' on' : '');
      b.dataset.cmd = 'reveal'; b.dataset.i = i;
      b.innerHTML = `<span><span class="n">${i + 1}</span><span class="t"></span></span><span>${a.pts}</span>`;
      b.querySelector('.t').textContent = a.text + (a.revealed ? ' ✓' : '');
      box.appendChild(b);
    });
    $('#bank').textContent = st.bank;
    $('#xs').textContent = '✕'.repeat(st.strikes || 0);
    [0, 1].forEach(t => {
      $('#n' + t).textContent = names[t];
      $('#s' + t).textContent = st.scores ? st.scores[t] : 0;
      $('#c' + t).textContent = st.control === t ? '▶ IN CONTROL' : '';
    });
  }
})();
</script>
</body>
</html>
