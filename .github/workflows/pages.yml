# Publishes the game to GitHub Pages.
# Uses the committed firebase-config.js, unless a FIREBASE_CONFIG repository secret is set (then that wins).
# Runs from claude/serene-euler-flw9ni because the github-pages environment only allows that branch;
# to deploy from main, allow main in Settings -> Environments -> github-pages and add it below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/serene-euler-flw9ni]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir _site
          cp -r *.html *.js *.css .nojekyll remote assets _site/
          python3 - <<'PY'
          import json, os, re
          raw = os.environ.get("FIREBASE_CONFIG", "").strip()
          cfg = None
          if raw:
              # Accept JSON or the JS snippet from the Firebase console: keep only the { ... } object.
              body = raw[raw.find("{"):raw.rfind("}") + 1]
              try:
                  cfg = json.loads(body)
              except ValueError:
                  cfg = dict(re.findall(r'(\w+)\s*:\s*["\'`]([^"\'`]*)["\'`]', body))
          if cfg and "apiKey" in cfg:
              with open("_site/firebase-config.js", "w") as f:
                  f.write("window.FIREBASE_CONFIG = %s;\n" % json.dumps(cfg))
              print("Using FIREBASE_CONFIG secret")
          else:
              print("Using committed firebase-config.js")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate job (GitHub's recommended layout) so the uploaded site is registered before deploying.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to register the uploaded site
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
